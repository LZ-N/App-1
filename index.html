<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ascend — Habit Quest</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12160F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#12160F;
    --surface:#1B2117;
    --surface-2:#212A1B;
    --surface-3:#28321F;
    --border:#2E3626;
    --border-soft:#242C1D;
    --text:#EDE8DC;
    --text-muted:#9A9C8E;
    --text-faint:#6B6F5F;
    --gold:#C9A227;
    --gold-soft:#E0C468;
    --sage:#7FA872;
    --sage-soft:#A8CC9C;
    --peri:#8E97C9;
    --peri-soft:#B0B7DE;
    --brick:#B3524B;
    --brick-soft:#D07A73;
    --font-display:Georgia,'Iowan Old Style','Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,'SF Mono','Roboto Mono',Consolas,monospace;
    --radius:10px;
    --radius-lg:16px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;padding:20px 16px 80px;}
  #loading{padding:60px 20px;text-align:center;color:var(--text-muted);font-family:var(--font-display);font-size:18px;}
  a{color:var(--gold-soft);}
  button{font-family:inherit;}
  ::selection{background:var(--gold);color:#1a1a12;}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
  }

  /* ===== Header / HUD ===== */
  .hud{
    background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px 20px;
    margin-bottom:18px;
  }
  .hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .wordmark{font-family:var(--font-display);font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:400;}
  .icon-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    border-radius:8px;padding:6px 10px;font-size:12px;letter-spacing:0.04em;cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  .icon-btn:hover{border-color:var(--gold);color:var(--gold-soft);}
  .hud-main{display:flex;gap:16px;align-items:center;}
  .glyph-wrap{
    width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--bg);border:1px solid var(--border);border-radius:50%;
  }
  .glyph-wrap svg{width:40px;height:40px;filter:drop-shadow(0 0 6px rgba(201,162,39,.35));}
  .hud-info{flex:1;min-width:0;}
  .level-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .level-num{font-family:var(--font-display);font-size:22px;color:var(--text);}
  .level-tier{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;}
  .xp-bar-track{background:var(--bg);border:1px solid var(--border);border-radius:99px;height:8px;overflow:hidden;}
  .xp-bar-fill{background:linear-gradient(90deg,var(--gold) 0%,var(--gold-soft) 100%);height:100%;border-radius:99px;transition:width .5s ease;}
  .xp-label{font-size:11px;color:var(--text-faint);margin-top:4px;font-variant-numeric:tabular-nums;}
  .hud-stats{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
  .hud-stat{display:flex;flex-direction:column;gap:2px;}
  .hud-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);}
  .hud-stat-val{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums;}
  .c-gold{color:var(--gold-soft);}
  .c-sage{color:var(--sage-soft);}
  .c-peri{color:var(--peri-soft);}
  .c-brick{color:var(--brick-soft);}

  /* ===== Tabs ===== */
  .tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    background:transparent;border:none;color:var(--text-muted);padding:10px 12px;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);}
  .tab-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--gold-soft);outline-offset:2px;
  }

  /* ===== Cards / ledger entries ===== */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
  }
  .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);margin-bottom:6px;display:block;}
  .section-title{font-family:var(--font-display);font-size:19px;margin:0 0 12px;color:var(--text);}
  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint);font-size:12.5px;}
  .empty{padding:22px 10px;text-align:center;color:var(--text-faint);font-size:13.5px;border:1px dashed var(--border);border-radius:var(--radius);}

  /* buttons */
  .btn{
    font-size:13px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);cursor:pointer;transition:all .15s;
  }
  .btn:hover{border-color:var(--text-muted);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--gold);border-color:var(--gold);color:#1a1608;font-weight:600;}
  .btn-primary:hover{background:var(--gold-soft);border-color:var(--gold-soft);}
  .btn-sage{background:var(--sage);border-color:var(--sage);color:#0f1a10;font-weight:600;}
  .btn-sage:hover{background:var(--sage-soft);}
  .btn-peri{background:var(--peri);border-color:var(--peri);color:#12142a;font-weight:600;}
  .btn-brick{background:var(--brick);border-color:var(--brick);color:#fff;}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:5px 10px;font-size:11.5px;}
  .btn-block{width:100%;}
  .btn-danger-outline{background:transparent;border-color:var(--brick);color:var(--brick-soft);}

  /* forms */
  label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:5px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;
  }
  input::placeholder,textarea::placeholder{color:var(--text-faint);}
  .field{margin-bottom:12px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  fieldset{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:0 0 12px;}
  legend{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);padding:0 6px;}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg label{margin:0;flex:1;text-align:center;padding:8px 6px;font-size:12px;text-transform:none;letter-spacing:0;cursor:pointer;color:var(--text-muted);border-right:1px solid var(--border);}
  .seg label:last-child{border-right:none;}
  .seg input{position:absolute;opacity:0;pointer-events:none;}
  .seg input:checked + label{background:var(--surface-3);color:var(--gold-soft);}

  /* habit row */
  .habit-item{border-top:1px solid var(--border-soft);padding:12px 0;}
  .habit-item:first-child{border-top:none;padding-top:0;}
  .habit-name-btn{background:none;border:none;color:var(--text);font-size:14.5px;text-align:left;cursor:pointer;padding:0;font-family:inherit;}
  .habit-name-btn:hover{color:var(--gold-soft);}
  .habit-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .check-circle{
    width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--border);
    background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:transparent;transition:all .15s;
  }
  .check-circle.done{background:var(--sage);border-color:var(--sage);color:#0f1a10;}
  .check-circle svg{width:15px;height:15px;}
  .diff-tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;border:1px solid var(--border);}
  .diff-easy{color:var(--sage-soft);}
  .diff-medium{color:var(--gold-soft);}
  .diff-hard{color:var(--brick-soft);}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:9.5px;text-align:center;color:var(--text-faint);text-transform:uppercase;padding-bottom:2px;}
  .cal-cell{
    aspect-ratio:1;border-radius:6px;border:1px solid var(--border-soft);background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-faint);
    cursor:pointer;font-variant-numeric:tabular-nums;
  }
  .cal-cell.done{background:var(--sage);border-color:var(--sage);color:#0f1a10;font-weight:600;}
  .cal-cell.frozen{background:var(--peri);border-color:var(--peri);color:#12142a;}
  .cal-cell.future,.cal-cell.outside{opacity:.3;cursor:default;pointer-events:none;}
  .cal-cell.today-marker{box-shadow:0 0 0 1.5px var(--gold-soft) inset;}

  /* progress / meter bars */
  .meter{background:var(--bg);border:1px solid var(--border);border-radius:99px;height:10px;overflow:hidden;}
  .meter-fill{height:100%;border-radius:99px;transition:width .4s ease;}

  /* modal / overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,8,.72);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}

  /* toast */
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-3);
    border:1px solid var(--gold);border-radius:var(--radius);padding:12px 18px;z-index:60;
    display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:toast-in .25s ease;max-width:90vw;
  }
  @keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

  /* misc */
  .divider{height:1px;background:var(--border-soft);margin:14px 0;}
  .list-plain{list-style:none;margin:0;padding:0;}
  .bar-chart{display:flex;align-items:flex-end;gap:8px;height:100px;padding-top:10px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-shape{width:100%;max-width:26px;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;}
  .bar-col-label{font-size:9.5px;color:var(--text-faint);}
  .achv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .achv{border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;}
  .achv.locked{opacity:.35;}
  .achv-name{color:var(--gold-soft);font-weight:600;margin-bottom:2px;}
  textarea{resize:vertical;min-height:56px;}
  .recap-stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
  .recap-stat:last-child{border-bottom:none;}

  /* reorder controls */
  .reorder-col{display:flex;flex-direction:column;gap:2px;flex:none;}
  .reorder-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    border-radius:5px;width:20px;height:16px;line-height:1;font-size:9px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .reorder-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-soft);}
  .reorder-btn:disabled{opacity:.25;cursor:default;}

  /* inline confirm */
  .confirm-inline{display:flex;align-items:center;gap:6px;font-size:12px;}
  .confirm-inline .muted{font-size:12px;}

  /* edit form panel */
  .edit-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:10px;}

  /* level-up toast */
  .toast-levelup{
    border-color:var(--gold-soft);font-weight:600;color:var(--gold-soft);
    box-shadow:0 0 0 2px rgba(224,196,104,.3),0 8px 24px rgba(0,0,0,.45);
    animation:levelup-toast 1.8s ease-in-out;
  }
  @keyframes levelup-toast{
    0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(1);}
    12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    28%{transform:translateX(-50%) scale(1.06);}
    42%{transform:translateX(-50%) scale(1);}
    58%{transform:translateX(-50%) scale(1.06);}
    72%{transform:translateX(-50%) scale(1);}
    100%{opacity:1;transform:translateX(-50%) scale(1);}
  }

  /* category tag + progress */
  .cat-tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;border:1px solid var(--border);}
  .cat-progress-row{margin-bottom:12px;}
  .cat-progress-row:last-child{margin-bottom:0;}
  .cat-progress-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .cat-progress-name{font-size:13px;font-weight:600;}
  .cat-progress-sub{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;}

  /* lifetime totals grid */
  .totals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
  .totals-cell{border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .totals-val{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--gold-soft);}
  .totals-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-top:2px;}

  .diff-tiny{color:var(--text-muted);} .diff-intense{color:#E0955C;} .diff-epic{color:var(--peri-soft);}
  .cog-btn{display:flex;align-items:center;justify-content:center;padding:6px;line-height:0;}
  .wheel-wrap{position:relative;width:150px;margin:6px auto 12px;}
  .wheel-wrap::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top:14px solid var(--text);z-index:2;}
  .wheel-wrap svg{width:100%;display:block;}
  .chal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
</style>
</head>
<body>
<div id="app"><div id="loading">Loading your progress…</div></div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONSTANTS
   ===================================================================== */
var STORAGE_KEY = 'ascend_state_v1';
var TIERS = [
  { id:'tiny', label:'Tiny', pts:2, coin:0 },
  { id:'easy', label:'Easy', pts:5, coin:2 },
  { id:'medium', label:'Medium', pts:10, coin:5 },
  { id:'hard', label:'Hard', pts:20, coin:10 },
  { id:'intense', label:'Intense', pts:35, coin:15 },
  { id:'epic', label:'Epic', pts:50, coin:25 }
];
var DIFFICULTY_POINTS = {}; TIERS.forEach(function(t){ DIFFICULTY_POINTS[t.id]=t.pts; });
var DEFAULT_COIN_CAP = 1000, DEFAULT_DAILY_COIN_CAP = 100; /* cents */
var WHEEL_MISSIONS = [
  ['Stretch for 20 minutes',20,5],['Read 1 chapter of a book',20,5],['Go for a run or jog',30,10],
  ['Take a 30-minute walk',25,5],['Do 20 push-ups (any sets)',20,5],['Tidy your desk or room for 10 minutes',15,0],
  ['Drink 2 litres of water today',15,0],['Meditate for 10 minutes',20,5],['Cook a proper meal from scratch',25,10],
  ['Call or message a friend or family',15,0],['Take a cold shower',20,5],['Write a page in a journal',15,0],
  ['Declutter one drawer or shelf',20,5],['No phone for the first hour after waking',25,5],
  ['Do a 15-minute workout',25,10],['Plank for 3 minutes in total',20,5]
];
var DEFAULT_CHALLENGES = [['Take a walk — 1 km',8],['Do 10 push-ups',5],['Drink a glass of water',2]];
var DOW_LABELS = ['Mo','Tu','We','Th','Fr','Sa','Su'];
var MONTH_LABELS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var CATEGORIES = [
  { id:'health', label:'Health', color:'var(--sage-soft)' },
  { id:'chores', label:'Chores', color:'var(--peri-soft)' },
  { id:'productivity', label:'Productivity', color:'var(--gold-soft)' },
  { id:'other', label:'Other', color:'var(--text-muted)' }
];
var LUCKY_CHANCE = 0.12;
var LUCKY_BONUS_FRACTION = 0.4;

var ACHIEVEMENTS = [
  { id:'first_step', name:'First Step', desc:'Complete your first habit', check:function(s,d){ return d.totalCompletions>=1; } },
  { id:'getting_started', name:'Getting Started', desc:'10 total habit check-ins', check:function(s,d){ return d.totalCompletions>=10; } },
  { id:'century', name:'Century Club', desc:'100 total habit check-ins', check:function(s,d){ return d.totalCompletions>=100; } },
  { id:'week_strong', name:'One Week Strong', desc:'7-day streak on any habit', check:function(s,d){ return d.bestStreak>=7; } },
  { id:'fortnight', name:'Two Week Warrior', desc:'14-day streak on any habit', check:function(s,d){ return d.bestStreak>=14; } },
  { id:'unstoppable', name:'Unstoppable', desc:'30-day streak on any habit', check:function(s,d){ return d.bestStreak>=30; } },
  { id:'level5', name:'Level 5', desc:'Reach level 5', check:function(s,d){ return d.level>=5; } },
  { id:'level10', name:'Level 10', desc:'Reach level 10', check:function(s,d){ return d.level>=10; } },
  { id:'level20', name:'Level 20', desc:'Reach level 20', check:function(s,d){ return d.level>=20; } },
  { id:'task_master', name:'Task Master', desc:'Complete 25 one-off tasks', check:function(s,d){ return d.tasksCompleted>=25; } },
  { id:'big_spender', name:'Big Spender', desc:'Make your first shop purchase', check:function(s,d){ return s.purchases.length>=1; } },
  { id:'challenger', name:'Challenger', desc:'Log 25 challenges', check:function(s,d){ return d.challengesDone>=25; } },
  { id:'wheel_regular', name:'Wheel Regular', desc:'Claim 7 wheel prizes', check:function(s,d){ return d.wheelsDone>=7; } },
  { id:'lucky_break', name:'Lucky Break', desc:'Hit your first lucky bonus', check:function(s,d){ return (s.luckyBonusCount||0)>=1; } },
  { id:'four_leaf', name:'Four-Leaf Clover', desc:'Hit 10 lucky bonuses', check:function(s,d){ return (s.luckyBonusCount||0)>=10; } },
  { id:'specialist', name:'Specialist', desc:'Reach level 5 in any category', check:function(s,d){ return categoryDerived().some(function(c){ return c.level>=5; }); } },
  { id:'well_rounded', name:'Well Rounded', desc:'Reach level 3 in every category', check:function(s,d){ return categoryDerived().every(function(c){ return c.level>=3; }); } }
];

/* =====================================================================
   STATE (module-level)
   ===================================================================== */
var state = null;
var ui = {
  activeTab:'today',
  expandedHabitId:null,
  calMonthOffset:0,
  showAddHabit:false,
  showAddTask:false,
  showAddShopItem:false,
  showAddChallenge:false,
  spinning:false,
  spinAngle:0,
  showEmergencyStartForm:false,
  showManualLogForm:false,
  showImportConfirm:false,
  pendingImportData:null,
  showResetConfirm:false,
  showRecap:false,
  recapData:null,
  toast:null,
  toastVariant:null,
  historyLimit:15,
  editingHabitId:null,
  editingTaskId:null,
  editingShopItemId:null,
  pendingDeleteKind:null,
  pendingDeleteId:null
};
var timerTickHandle = null;
var toastTimeoutHandle = null;

/* =====================================================================
   DATE UTILITIES (local time, avoids UTC off-by-one bugs)
   ===================================================================== */
function pad2(n){ return (n<10?'0':'')+n; }
function localDateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDateKey(key){ var p=key.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function todayKey(){ return localDateKey(new Date()); }
function addDaysKey(key,delta){ var d=parseDateKey(key); d.setDate(d.getDate()+delta); return localDateKey(d); }
function weekKeyFor(key){
  var d=parseDateKey(key);
  var day=d.getDay();
  var diffToMonday=(day===0?-6:1-day);
  d.setDate(d.getDate()+diffToMonday);
  return localDateKey(d);
}
function compareKeys(a,b){ return a<b?-1:(a>b?1:0); }
function formatDateHuman(key){
  var d=parseDateKey(key);
  return MONTH_LABELS[d.getMonth()].slice(0,3)+' '+d.getDate();
}

/* =====================================================================
   STORAGE — layered & defensive: Claude storage -> localStorage -> memory.
   Never allowed to throw or hang; loadState() always resolves, persist()
   never blocks rendering even if every backend is unavailable.
   ===================================================================== */
var storageMode='detecting'; // 'claude' | 'local' | 'memory'
var memoryStore={};
function waitForClaudeStorage(maxWaitMs){
  return new Promise(function(resolve){
    var waited=0, step=100;
    (function poll(){
      try{
        if(window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function'){
          resolve(true); return;
        }
      }catch(e){ /* keep polling */ }
      waited+=step;
      if(waited>=maxWaitMs){ resolve(false); return; }
      setTimeout(poll,step);
    })();
  });
}
function detectStorageMode(){
  if(storageMode!=='detecting') return Promise.resolve(storageMode);
  return waitForClaudeStorage(1500).then(function(hasClaude){
    if(hasClaude){ storageMode='claude'; return storageMode; }
    try{
      var probe='__ascend_probe__';
      window.localStorage.setItem(probe,'1');
      window.localStorage.removeItem(probe);
      storageMode='local';
    }catch(e){
      storageMode='memory';
    }
    return storageMode;
  });
}
function safeParse(str){ try{ return JSON.parse(str); }catch(e){ return null; } }
function loadState(){
  return detectStorageMode().then(function(mode){
    if(mode==='claude'){
      return window.storage.get(STORAGE_KEY,false).then(function(res){
        return (res && res.value)?safeParse(res.value):null;
      }).catch(function(){ return null; });
    }
    if(mode==='local'){
      try{
        var v=window.localStorage.getItem(STORAGE_KEY);
        return v?safeParse(v):null;
      }catch(e){ return null; }
    }
    return memoryStore[STORAGE_KEY]?safeParse(memoryStore[STORAGE_KEY]):null;
  }).catch(function(){ return null; });
}
var saveInFlight=false, savePending=false;
function persist(){
  if(saveInFlight){ savePending=true; return; }
  saveInFlight=true;
  var json;
  try{ json=JSON.stringify(state); }catch(e){ saveInFlight=false; return; }
  var finish=function(){ saveInFlight=false; if(savePending){ savePending=false; persist(); } };
  detectStorageMode().then(function(mode){
    if(mode==='claude'){
      window.storage.set(STORAGE_KEY,json,false).catch(function(e){ console.error('Ascend: save failed',e); }).then(finish);
    } else if(mode==='local'){
      try{ window.localStorage.setItem(STORAGE_KEY,json); }catch(e){ console.error('Ascend: local save failed',e); }
      finish();
    } else {
      memoryStore[STORAGE_KEY]=json;
      finish();
    }
  }).catch(finish);
}

/* =====================================================================
   FORMAT / ESCAPE HELPERS
   ===================================================================== */
function esc(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g,function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;';
  });
}
function clampInt(v,min,max,fallback){
  var n=parseInt(v,10);
  if(isNaN(n)) n=fallback;
  if(min!==undefined && n<min) n=min;
  if(max!==undefined && n>max) n=max;
  return n;
}

/* =====================================================================
   LEVEL / XP CURVE
   ===================================================================== */
function xpForLevel(level){ return Math.round(50*Math.pow(level,1.5)); }
function levelInfo(totalXp){
  var level=1, used=0, guard=0;
  while(guard<2000){
    var need=xpForLevel(level);
    if(used+need>totalXp) break;
    used+=need; level++; guard++;
  }
  var need=xpForLevel(level);
  return { level:level, xpIntoLevel:totalXp-used, xpForNext:need, progress:need>0?(totalXp-used)/need:0 };
}
function levelTierName(level){
  if(level>=21) return 'Ancient Bloom';
  if(level>=11) return 'Young Tree';
  if(level>=6) return 'Sapling';
  if(level>=3) return 'Sprout';
  return 'Seed';
}

/* =====================================================================
   STREAKS
   ===================================================================== */
function freezesUsedInMonth(habit, monthKey){
  return (habit.freezes||[]).filter(function(k){ return monthKeyOf(k)===monthKey; }).length;
}
function isCoveredDay(habit, key){
  return habit.completions.hasOwnProperty(key) || (habit.freezes||[]).indexOf(key)!==-1;
}
function streakEndingAt(habit, dateKey){
  var count=0, key=dateKey, guard=0;
  while(guard<3660){
    if(isCoveredDay(habit,key)){ count++; key=addDaysKey(key,-1); guard++; }
    else break;
  }
  return count;
}
function currentStreak(habit){
  var t=todayKey();
  if(isCoveredDay(habit,t)) return streakEndingAt(habit,t);
  var y=addDaysKey(t,-1);
  if(isCoveredDay(habit,y)) return streakEndingAt(habit,y);
  return 0;
}
function streakMultiplier(streak){
  if(streak>=30) return 1.5;
  if(streak>=14) return 1.35;
  if(streak>=7) return 1.2;
  if(streak>=3) return 1.1;
  return 1.0;
}
function bestStreakAcrossHabits(){
  var best=0;
  (state.habits||[]).forEach(function(h){ var s=currentStreak(h); if(s>best) best=s; });
  return best;
}
function longestStreakEver(habit){
  var keys=Object.keys(habit.completions||{}).concat(habit.freezes||[]);
  keys=keys.filter(function(k,idx){ return keys.indexOf(k)===idx; }).sort(compareKeys);
  if(!keys.length) return 0;
  var best=1, run=1;
  for(var i=1;i<keys.length;i++){
    if(addDaysKey(keys[i-1],1)===keys[i]) run++;
    else run=1;
    if(run>best) best=run;
  }
  return best;
}
function longestStreakEverAcrossHabits(){
  var best=0;
  (state.habits||[]).forEach(function(h){ var s=longestStreakEver(h); if(s>best) best=s; });
  return best;
}

/* =====================================================================
   DERIVED TOTALS (ledger-derived, not stored counters — self-healing)
   ===================================================================== */
function computeDerived(){
  var totalXp=0, totalCompletions=0, tasksCompleted=0, emergencySessionsLogged=0;
  (state.habits||[]).forEach(function(h){
    Object.keys(h.completions||{}).forEach(function(k){
      totalXp+=h.completions[k];
      totalCompletions++;
    });
  });
  (state.tasks||[]).forEach(function(t){
    if(t.done){ totalXp+=t.pointsAwarded||0; tasksCompleted++; }
  });
  (state.challengeLogs||[]).forEach(function(l){ totalXp+=l.points||0; });
  (state.wheelLog||[]).forEach(function(l){ totalXp+=l.points||0; });
  var spent=0;
  (state.purchases||[]).forEach(function(p){ spent+=p.cost; });
  (state.topups||[]).forEach(function(t){ spent+=t.pointsSpent; });
  (state.pcLedger.sessions||[]).forEach(function(s){ if(s.type==='emergency') emergencySessionsLogged++; });
  var points=totalXp-spent;
  var cap=state.settings && state.settings.pointsCap;
  if(cap && cap>0 && points>cap) points=cap;
  var li=levelInfo(totalXp);
  return {
    xp:totalXp,
    points:points,
    pointsSpent:spent,
    totalCompletions:totalCompletions,
    tasksCompleted:tasksCompleted,
    emergencySessionsLogged:emergencySessionsLogged,
    challengesDone:(state.challengeLogs||[]).length,
    wheelsDone:(state.wheelLog||[]).length,
    bestStreak:bestStreakAcrossHabits(),
    bestStreakEver:longestStreakEverAcrossHabits(),
    level:li.level,
    xpIntoLevel:li.xpIntoLevel,
    xpForNext:li.xpForNext,
    progress:li.progress
  };
}
function categoryXp(catId){
  var xp=0;
  (state.habits||[]).forEach(function(h){
    if((h.category||'other')!==catId) return;
    Object.keys(h.completions||{}).forEach(function(k){ xp+=h.completions[k]; });
  });
  return xp;
}
function categoryDerived(){
  return CATEGORIES.map(function(c){
    var xp=categoryXp(c.id);
    var li=levelInfo(xp);
    return { id:c.id, label:c.label, color:c.color, xp:xp, level:li.level, xpIntoLevel:li.xpIntoLevel, xpForNext:li.xpForNext, progress:li.progress };
  });
}

function coinRoom(dateKey){

}
function awardCoins(cents,dateKey){
  if(cents<=0 || dateKey!==todayKey()) return 0;
  var a=Math.min(cents,coinRoom(dateKey));
  if(a<=0) return 0;
  var w=state.wallet; w.cents+=a; w.daily[dateKey]=(w.daily[dateKey]||0)+a;
  return a;
}
function revokeCoins(a,dateKey){

  var w=state.wallet; w.cents=Math.max(0,w.cents-a); w.daily[dateKey]=Math.max(0,(w.daily[dateKey]||0)-a);

  state.wallet.spent.push({ id:uid(), name:name.slice(0,60), cents:cents, at:todayKey() });

function toggleHabitDay(habitId,dateKey){

    if(!habit.coins) habit.coins={};
    revokeCoins(habit.coins[dateKey]||0,dateKey); delete habit.coins[dateKey];
    delete habit.completions[dateKey];
  } else {
    var streak=streakEndingAt(habit,dateKey);
    var mult=streakMultiplier(streak);
    var base=(state.settings.difficultyPoints[habit.difficulty])||DIFFICULTY_POINTS[habit.difficulty]||10;
    var pts=Math.round(base*mult);
    if(Math.random()<LUCKY_CHANCE){
      bonus=Math.max(1,Math.round(base*LUCKY_BONUS_FRACTION));
      pts+=bonus;
      lucky=true;
      state.luckyBonusCount=(state.luckyBonusCount||0)+1;
    }
    habit.completions[dateKey]=pts;
    coinGot=awardCoins(tierInfo(habit.difficulty).coin,dateKey);
    if(!habit.coins) habit.coins={};
    habit.coins[dateKey]=coinGot;
  }
  checkAchievements();
  var levelAfter=computeDerived().level;
  if(levelAfter>levelBefore) queueLevelUpToast(levelAfter);
  else if(lucky) queueToast('\u2728 Lucky bonus! +'+bonus+'p on '+habit.name+(coinGot?' \u00b7 +'+fmtMoney(coinGot):''));
  else if(coinGot) queueToast('+'+fmtMoney(coinGot));
  persist(); render();
}
function useStreakFreeze(habitId){
  var habit=findHabit(habitId);
  if(!habit) return;
  var mk=todayMonthKey();
  if(freezesUsedInMonth(habit,mk)>=2) return;
  var key=addDaysKey(todayKey(),-1), guard=0;
  while(guard<60 && compareKeys(key,habit.createdAt)>=0){
    if(!isCoveredDay(habit,key)){
      habit.freezes.push(key);
      persist(); render();
      return;
    }
    key=addDaysKey(key,-1); guard++;
  }
}
function archiveHabit(habitId){

function moveHabit(habitId,dir){
  var list=state.habits||[];

  var pos=activeIdxs.indexOf(list.findIndex(function(h){ return h.id===habitId; }));

  if(s.settings.coinCapCents===undefined) s.settings.coinCapCents=DEFAULT_COIN_CAP;

  if(!s.challengeLogs) s.challengeLogs=[];
  if(!s.wheelLog) s.wheelLog=[];

  if(s.wallet.cents>s.settings.coinCapCents) s.wallet.cents=s.settings.coinCapCents;

/* =====================================================================
   RECAP (new-day detection)
   ===================================================================== */
function buildRecap(dateKey){
  var habitsDone=0, habitsTotal=0, points=0;
  (state.habits||[]).forEach(function(h){
    if(h.archived) return;
    if(compareKeys(h.createdAt,dateKey)>0) return;
    habitsTotal++;
    if(h.completions.hasOwnProperty(dateKey)){ habitsDone++; points+=h.completions[dateKey]; }
  });
  (state.tasks||[]).forEach(function(t){ if(t.completedAt===dateKey) points+=t.pointsAwarded; });
  points+=extraPointsOn(dateKey);
  var pcMinutes=0;
  sessionsForDay(dateKey).forEach(function(s){ pcMinutes+=s.minutes; });
  return { dateKey:dateKey, habitsDone:habitsDone, habitsTotal:habitsTotal, points:points, pcMinutes:pcMinutes };
}
function checkNewDay(){
  var t=todayKey();
  if(state.lastOpenedDate && state.lastOpenedDate!==t){
    ui.showRecap=true;
    ui.recapData=buildRecap(state.lastOpenedDate);
  }
  state.lastOpenedDate=t;
}

function renderHabitDetail(h){
  if(ui.editingHabitId===h.id){
    return '<div class="edit-panel"><form data-form="edit-habit" class="stack">'+
      '<input type="hidden" name="id" value="'+h.id+'">'+
      '<div class="field"><label for="eh-name-'+h.id+'">Habit name</label><input type="text" id="eh-name-'+h.id+'" name="name" value="'+esc(h.name)+'" maxlength="60" required></div>'+
      '<div class="field"><label for="eh-tier-'+h.id+'">Tier</label>'+tierSelectHtml('eh-tier-'+h.id,'difficulty',h.difficulty)+'</div>'+
      '<div class="field"><label for="eh-category-'+h.id+'">Category</label>'+categorySelectHtml('eh-category-'+h.id,'category',h.category||'other')+'</div>'+
      '<div class="row"><button type="submit" class="btn btn-sage">Save</button><button type="button" class="btn btn-ghost" data-action="cancel-edit-habit">Cancel</button></div>'+
    '</form></div>';
  }
  var freezesLeft=2-freezesUsedInMonth(h,todayMonthKey());
  var refDate=new Date();
  refDate.setMonth(refDate.getMonth()+ui.calMonthOffset);
  var y=refDate.getFullYear(), m=refDate.getMonth();
  var firstOfMonth=new Date(y,m,1);
  var startOffset=(firstOfMonth.getDay()+6)%7; // Monday-first offset
  var daysInMonth=new Date(y,m+1,0).getDate();
  var t=todayKey();

  var html='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);">';
  html+='<div class="cal-head"><button class="icon-btn" data-action="cal-prev" '+(ui.calMonthOffset<=-6?'disabled':'')+'>&larr;</button>'+
    '<strong>'+MONTH_LABELS[m]+' '+y+'</strong>'+
    '<button class="icon-btn" data-action="cal-next" '+(ui.calMonthOffset>=0?'disabled':'')+'>&rarr;</button></div>';
  html+='<div class="cal-grid">';
  DOW_LABELS.forEach(function(dl){ html+='<div class="cal-dow">'+dl+'</div>'; });
  for(var i=0;i<startOffset;i++) html+='<div class="cal-cell outside"></div>';
  for(var day=1;day<=daysInMonth;day++){
    var key=y+'-'+pad2(m+1)+'-'+pad2(day);
    var cls='cal-cell';
    var isFuture=compareKeys(key,t)>0;
    var beforeCreation=compareKeys(key,h.createdAt)<0;
    if(h.completions.hasOwnProperty(key)) cls+=' done';
    else if((h.freezes||[]).indexOf(key)!==-1) cls+=' frozen';
    if(isFuture||beforeCreation) cls+=' future';
    if(key===t) cls+=' today-marker';
    html+='<div class="'+cls+'" '+(isFuture||beforeCreation?'':'data-action="toggle-habit" data-habit="'+h.id+'" data-date="'+key+'"')+'>'+day+'</div>';
  }
  html+='</div>';
  html+='<div class="row-between" style="margin-top:12px;">'+
    '<span class="faint">Green = done · Blue = streak freeze</span>'+
    '<button class="btn btn-sm" data-action="use-freeze" data-habit="'+h.id+'" '+(freezesLeft<=0?'disabled':'')+'>Use freeze ('+Math.max(0,freezesLeft)+' left)</button>'+
  '</div>';
  html+='<div class="faint" style="margin-top:8px;">Longest streak ever: '+longestStreakEver(h)+' days</div>';
  if(ui.pendingDeleteKind==='habit' && ui.pendingDeleteId===h.id){
    html+='<div class="confirm-inline" style="margin-top:12px;"><span class="muted">Archive this habit?</span><button class="btn btn-brick btn-sm" data-action="confirm-delete" data-kind="habit" data-id="'+h.id+'">Yes, archive</button><button class="btn btn-ghost btn-sm" data-action="cancel-delete">Cancel</button></div>';
  } else {
    html+='<div class="row" style="margin-top:12px;">'+
      '<button class="btn btn-sm" data-action="edit-habit" data-habit="'+h.id+'">Edit</button>'+
      '<button class="btn btn-danger-outline btn-sm" data-action="ask-delete" data-kind="habit" data-id="'+h.id+'">Archive habit</button>'+
      '<button class="btn btn-ghost btn-sm" data-action="expand-habit" data-habit="'+h.id+'">Close</button>'+
    '</div>';
  }
  html+='</div>';
  return html;
}

/* =====================================================================
   RENDER — STATS
   ===================================================================== */
function renderStats(){
  var html='';
  var days=[]; var k=todayKey();
  for(var i=6;i>=0;i--) days.push(addDaysKey(k,-i));
  var maxPts=1;
  var dayPoints=days.map(function(dk){
    var pts=0;
    (state.habits||[]).forEach(function(h){ if(h.completions.hasOwnProperty(dk)) pts+=h.completions[dk]; });
    (state.tasks||[]).forEach(function(t){ if(t.completedAt===dk) pts+=t.pointsAwarded; });
    pts+=extraPointsOn(dk);
    if(pts>maxPts) maxPts=pts;
    return pts;
  });
  var chartInner='<h2 class="section-title" style="margin-bottom:0;">Points — last 7 days</h2><div class="bar-chart">';
  days.forEach(function(dk,idx){
    var h=Math.max(3,Math.round((dayPoints[idx]/maxPts)*90));
    chartInner+='<div class="bar-col"><div class="bar-shape" style="height:'+h+'px;"></div><div class="bar-col-label">'+dayPoints[idx]+'</div><div class="bar-col-label">'+formatDateHuman(dk).split(' ')[1]+'</div></div>';
  });
  chartInner+='</div>';
  html+=card(null,chartInner);

  var active=(state.habits||[]).filter(function(h){ return !h.archived; });
  var last30=[]; for(var j=29;j>=0;j--) last30.push(addDaysKey(k,-j));
  var possible=0, completed=0;
  active.forEach(function(h){
    last30.forEach(function(dk){
      if(compareKeys(dk,h.createdAt)<0) return;
      possible++;
      if(isCoveredDay(h,dk)) completed++;
    });
  });
  var rate=possible>0?Math.round((completed/possible)*100):0;
  var rateInner='<h2 class="section-title" style="margin-bottom:10px;">30-day completion rate</h2>'+
    '<div class="row-between" style="margin-bottom:6px;"><span class="hud-stat-val c-sage">'+rate+'%</span><span class="faint">'+completed+' / '+possible+' habit-days</span></div>'+
    meter(completed,Math.max(1,possible),'var(--sage)');
  html+=card(null,rateInner);


  var achvInner='<h2 class="section-title" style="margin-bottom:10px;">Achievements</h2><div class="achv-grid">';
  var unlockedIds=(state.achievements||[]).map(function(a){return a.id;});
  ACHIEVEMENTS.forEach(function(a){
    var isUnlocked=unlockedIds.indexOf(a.id)!==-1;
    achvInner+='<div class="achv'+(isUnlocked?'':' locked')+'"><div class="achv-name">'+a.name+'</div><div class="faint">'+a.desc+'</div></div>';
  });
  achvInner+='</div>';
  html+=card(null,achvInner);

  var d=computeDerived();
  var totalsInner='<h2 class="section-title" style="margin-bottom:12px;">Lifetime totals</h2><div class="totals-grid">'+
    '<div class="totals-cell"><div class="totals-val">'+d.xp+'</div><div class="totals-label">Total XP earned</div></div>'+
    '<div class="totals-cell"><div class="totals-val">'+d.totalCompletions+'</div><div class="totals-label">Habit check-ins</div></div>'+
    '<div class="totals-cell"><div class="totals-val">'+d.tasksCompleted+'</div><div class="totals-label">Tasks completed</div></div>'+
    '<div class="totals-cell"><div class="totals-val">'+d.pointsSpent+'</div><div class="totals-label">Points spent</div></div>'+
    '<div class="totals-cell"><div class="totals-val">'+(state.luckyBonusCount||0)+'</div><div class="totals-label">Lucky bonuses hit</div></div>'+
    '<div class="totals-cell"><div class="totals-val">'+d.bestStreakEver+'</div><div class="totals-label">Longest streak ever</div></div>'+
    '<div class="totals-cell"><div class="totals-val">'+unlockedIds.length+' / '+ACHIEVEMENTS.length+'</div><div class="totals-label">Achievements</div></div>'+
    '<div class="totals-cell"><div class="totals-val">'+d.challengesDone+'</div><div class="totals-label">Challenges done</div></div>'+
  '</div>';
  html+=card(null,totalsInner);
  return html;
}

/* =====================================================================
   EVENT DELEGATION
   ===================================================================== */
function onClick(e){
  var el=e.target.closest('[data-action]');
  if(!el) return;
  var action=el.getAttribute('data-action');
  switch(action){
    case 'set-tab':
      ui.activeTab=el.getAttribute('data-tab'); ui.expandedHabitId=null;
      ui.editingHabitId=null; ui.editingTaskId=null; ui.editingShopItemId=null;
      ui.pendingDeleteKind=null; ui.pendingDeleteId=null;
      render();
      break;
    case 'spin-wheel': spinWheel(); break;
    case 'claim-wheel': claimWheel(); break;
    case 'log-challenge': logChallenge(el.getAttribute('data-id')); break;
    case 'undo-challenge': undoChallenge(el.getAttribute('data-id')); break;
    case 'show-add-challenge': ui.showAddChallenge=true; render(); break;
    case 'cancel-add-challenge': ui.showAddChallenge=false; render(); break;
    case 'open-glance': location.hash='glance'; break;
    case 'exit-glance': location.hash=''; ui.activeTab='today'; render(); break;
    case 'goto-settings': if(location.hash==='#glance') location.hash=''; ui.activeTab='settings'; render(); break;
    case 'goto-settings-old': ui.activeTab='settings'; render(); break;
    case 'toggle-habit': toggleHabitDay(el.getAttribute('data-habit'),el.getAttribute('data-date')); break;
    case 'expand-habit':
      var hid=el.getAttribute('data-habit');
      ui.expandedHabitId=(ui.expandedHabitId===hid)?null:hid;
      ui.calMonthOffset=0;
      ui.editingHabitId=null;
      ui.pendingDeleteKind=null; ui.pendingDeleteId=null;
      render();
      break;
    case 'cal-prev': ui.calMonthOffset--; render(); break;
    case 'cal-next': if(ui.calMonthOffset<0){ui.calMonthOffset++; render();} break;
    case 'use-freeze': useStreakFreeze(el.getAttribute('data-habit')); break;
    case 'show-add-habit': ui.showAddHabit=true; render(); break;
    case 'cancel-add-habit': ui.showAddHabit=false; render(); break;
    case 'edit-habit': ui.editingHabitId=el.getAttribute('data-habit'); render(); break;
    case 'cancel-edit-habit': ui.editingHabitId=null; render(); break;
    case 'move-habit-up': moveHabit(el.getAttribute('data-habit'),-1); break;
    case 'move-habit-down': moveHabit(el.getAttribute('data-habit'),1); break;
    case 'toggle-task': toggleTask(el.getAttribute('data-task')); break;
    case 'show-add-task': ui.showAddTask=true; render(); break;
    case 'cancel-add-task': ui.showAddTask=false; render(); break;
    case 'edit-task': ui.editingTaskId=el.getAttribute('data-task'); render(); break;
    case 'cancel-edit-task': ui.editingTaskId=null; render(); break;
    case 'buy-item': buyShopItem(el.getAttribute('data-item')); break;
    case 'show-add-shop-item': ui.showAddShopItem=true; render(); break;
    case 'cancel-add-shop-item': ui.showAddShopItem=false; render(); break;
    case 'edit-shop-item': ui.editingShopItemId=el.getAttribute('data-item'); render(); break;
    case 'cancel-edit-shop-item': ui.editingShopItemId=null; render(); break;
    case 'move-shop-up': moveShopItem(el.getAttribute('data-item'),-1); break;
    case 'move-shop-down': moveShopItem(el.getAttribute('data-item'),1); break;
    case 'ask-delete':
      ui.pendingDeleteKind=el.getAttribute('data-kind');
      ui.pendingDeleteId=el.getAttribute('data-id');
      render();
      break;
    case 'cancel-delete': ui.pendingDeleteKind=null; ui.pendingDeleteId=null; render(); break;
    case 'confirm-delete':
      var dk=el.getAttribute('data-kind'), di=el.getAttribute('data-id');
      if(dk==='task') deleteTask(di);
      else if(dk==='shop') deleteShopItem(di);
      else if(dk==='habit') archiveHabit(di);
      else if(dk==='challenge') deleteChallenge(di);
      break;
    case 'start-timer': startTimer(el.getAttribute('data-type'),null); break;
    case 'stop-timer': stopTimer(); break;
    case 'cancel-timer': cancelTimer(); break;
    case 'show-emergency-start': ui.showEmergencyStartForm=true; render(); break;
    case 'cancel-emergency-start': ui.showEmergencyStartForm=false; render(); break;
    case 'show-manual-log': ui.showManualLogForm=true; render(); break;
    case 'cancel-manual-log': ui.showManualLogForm=false; render(); break;
    case 'buy-topup': buyTopup(); break;
    case 'show-more-history': ui.historyLimit+=30; render(); break;
    case 'export-data': exportData(); break;
    case 'trigger-import': document.getElementById('import-file-input').click(); break;
    case 'show-reset': ui.showResetConfirm=true; render(); break;
    case 'cancel-reset': ui.showResetConfirm=false; render(); break;
    case 'confirm-reset': resetAllData(); break;
    case 'dismiss-recap': ui.showRecap=false; persist(); render(); break;
    case 'dismiss-recap-overlay': ui.showRecap=false; persist(); render(); break;
    case 'confirm-import': importDataConfirmed(); break;
    case 'cancel-import': ui.showImportConfirm=false; ui.pendingImportData=null; render(); break;
  }
}
function onSubmit(e){
  var form=e.target.closest('[data-form]');
  if(!form) return;
  e.preventDefault();
  var type=form.getAttribute('data-form');
  var fd=new FormData(form);
  switch(type){
    case 'add-habit': addHabit(fd.get('name'),fd.get('difficulty'),fd.get('category')); break;
    case 'edit-habit': updateHabit(fd.get('id'),fd.get('name'),fd.get('difficulty'),fd.get('category')); break;
    case 'add-task': addTask(fd.get('name'),fd.get('points'),fd.get('deadline')); break;
    case 'edit-task': editTask(fd.get('id'),fd.get('name'),fd.get('points'),fd.get('deadline')); break;
    case 'add-shop-item': addShopItem(fd.get('name'),fd.get('cost')); break;
    case 'edit-shop-item': editShopItem(fd.get('id'),fd.get('name'),fd.get('cost')); break;
    case 'add-challenge': addChallenge(fd.get('name'),fd.get('points')); break;
    case 'spend-coins': spendCoins(fd.get('name'),Math.round(parseFloat(fd.get('amount'))*100)); break;
    case 'start-emergency': startTimer('emergency',fd.get('reason')); break;
    case 'manual-log': logManualSession(fd.get('type'),fd.get('minutes'),fd.get('reason')); break;
    case 'settings':
      var sf={ pointsCap:fd.get('pointsCap'), coinCap:fd.get('coinCap'), dailyCoinCap:fd.get('dailyCoinCap') };
      TIERS.forEach(function(t){ sf[t.id]=fd.get(t.id); });
      updateSettings(sf);
      break;
  }
}
function onChange(e){
  if(e.target && e.target.id==='import-file-input' && e.target.files && e.target.files[0]){
    var reader=new FileReader();
    reader.onload=function(evt){
      try{
        var parsed=JSON.parse(evt.target.result);
        if(!parsed || typeof parsed!=='object' || !('habits' in parsed)){
          queueToast('That file doesn\'t look like an Ascend backup'); render(); return;
        }
        ui.pendingImportData=parsed;
        ui.showImportConfirm=true;
        render();
      }catch(err){ queueToast('Could not read that file'); render(); }
    };
    reader.readAsText(e.target.files[0]);
  }
}

/* =====================================================================
   INIT — a watchdog guarantees the app renders within a few seconds no
   matter what happens with storage detection, so it can never get stuck
   on the loading screen.
   ===================================================================== */
var appRendered=false;
var listenersAttached=false;
function attachListenersOnce(){
  if(listenersAttached) return;
  listenersAttached=true;
  document.addEventListener('click',onClick);
  document.addEventListener('submit',onSubmit);
  document.addEventListener('change',onChange);
  window.addEventListener('hashchange',render);
}
function finishInit(loaded,warn){
  state=normalizeState(loaded||defaultState());
  checkNewDay();
  checkAchievements();
  if(warn) ui.toast='Started a fresh session — reload if you expected saved progress';
  persist();
  render();
  attachListenersOnce();
  if(state.pcLedger.activeTimer) startTimerTick();
  if(warn){
    if(toastTimeoutHandle) clearTimeout(toastTimeoutHandle);
    toastTimeoutHandle=setTimeout(function(){ ui.toast=null; render(); },5000);
  }
}
function init(){
  var watchdog=setTimeout(function(){
    if(!appRendered){
      console.error('Ascend: init did not complete in time, starting a fresh in-memory session');
      finishInit(null,true);
    }
  },4000);
  loadState().then(function(loaded){
    clearTimeout(watchdog);
    if(!appRendered) finishInit(loaded,false);
  }).catch(function(e){
    clearTimeout(watchdog);
    if(!appRendered){
      console.error('Ascend: load failed, starting fresh', e);
      finishInit(null,true);
    }
  });
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else {
  init();
}

/* expose for automated testing harness only (no-op in normal use) */
window.__ascendTestHooks={ getState:function(){return state;}, getUi:function(){return ui;}, getStorageMode:function(){return storageMode;} };

})();
</script>
<script>
/* Registers the service worker when this file is served from a real
   web origin (e.g. GitHub Pages). Harmless no-op anywhere else — it's
   wrapped in a try/catch so it never breaks the app if the browser or
   environment doesn't support it (like inside a chat preview). */
(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      try{
        navigator.serviceWorker.register('service-worker.js').catch(function(){ /* not on a supported origin — ignore */ });
      }catch(e){ /* ignore */ }
    });
  }
})();
</script>
